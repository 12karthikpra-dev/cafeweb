<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibes Café - Interactive Reviewer & Showcase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    h1, h2, h3, .font-display {
      font-family: 'Playfair Display', 'Fraunces', Georgia, serif;
      letter-spacing: -0.025em;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body { font-family: 'Montserrat', sans-serif; }
    .device-frame {
      transition: width 0.3s ease, height 0.3s ease;
    }
  </style>
</head>
<body class="bg-[#1c1c17] text-[#fcf9f1] h-screen flex flex-col overflow-hidden">
  
  <!-- Reviewer Navigation Header -->
  <header class="bg-[#271310] border-b border-[#3e2723] px-6 py-3 flex flex-wrap justify-between items-center z-50 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-[#A84432] flex items-center justify-center text-white font-bold text-sm">
        ☕
      </div>
      <div>
        <h1 class="font-bold text-sm text-white flex items-center gap-2">
          <span>Vibes Café Digital Experience</span>
          <span class="bg-[#A84432]/20 border border-[#A84432]/30 text-[#A84432] text-[10px] px-2 py-0.5 rounded-full uppercase font-bold">Review Bundle</span>
        </h1>
        <p class="text-[11px] text-[#ae8d87]">Interactive Screen Switcher & Previewer</p>
      </div>
    </div>

    <!-- Page Switcher Tabs -->
    <div class="flex items-center gap-1 bg-[#1c1c17] p-1 rounded-xl border border-[#3e2723] overflow-x-auto">
      <button onclick="loadScreen('home')" data-screen="home" class="screen-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-[#A84432] text-white font-bold transition-all">🏠 Home</button>
      <button onclick="loadScreen('menu')" data-screen="menu" class="screen-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-[#ae8d87] hover:text-white transition-all">📖 Menu</button>
      <button onclick="loadScreen('about')" data-screen="about" class="screen-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-[#ae8d87] hover:text-white transition-all">🌿 About</button>
      <button onclick="loadScreen('branches')" data-screen="branches" class="screen-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-[#ae8d87] hover:text-white transition-all">📍 Branches</button>
      <button onclick="loadScreen('gallery')" data-screen="gallery" class="screen-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-[#ae8d87] hover:text-white transition-all">🖼️ Gallery</button>
      <button onclick="loadScreen('contact')" data-screen="contact" class="screen-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-[#ae8d87] hover:text-white transition-all">✉️ Contact</button>
      <button onclick="loadScreen('reviews')" data-screen="reviews" class="screen-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-[#ae8d87] hover:text-white transition-all">⭐ Reviews</button>
      <button onclick="loadScreen('login')" data-screen="login" class="screen-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-[#ae8d87] hover:text-white transition-all">🔐 Login</button>
      <button onclick="loadScreen('worker')" data-screen="worker" class="screen-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-[#ae8d87] hover:text-white transition-all">📋 Barista KDS</button>
      <button onclick="loadScreen('admin')" data-screen="admin" class="screen-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-[#ae8d87] hover:text-white transition-all">📊 Admin</button>
    </div>

    <!-- Viewport Size Switcher & Direct Open -->
    <div class="flex items-center gap-2">
      <div class="flex items-center bg-[#1c1c17] p-1 rounded-xl border border-[#3e2723]">
        <button onclick="setViewport('desktop')" id="vp-desktop" class="p-1.5 rounded-lg bg-[#3e2723] text-white" title="Desktop View (100%)">
          <span class="material-symbols-outlined text-[18px]">desktop_windows</span>
        </button>
        <button onclick="setViewport('tablet')" id="vp-tablet" class="p-1.5 rounded-lg text-[#ae8d87] hover:text-white" title="Tablet View (768px)">
          <span class="material-symbols-outlined text-[18px]">tablet_mac</span>
        </button>
        <button onclick="setViewport('mobile')" id="vp-mobile" class="p-1.5 rounded-lg text-[#ae8d87] hover:text-white" title="Mobile View (375px)">
          <span class="material-symbols-outlined text-[18px]">smartphone</span>
        </button>
      </div>

      <a id="direct-open-link" href="home_vibes_caf/code.html" target="_blank" class="bg-[#3e2723] hover:bg-[#504442] text-white px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1 transition-colors">
        <span class="material-symbols-outlined text-[16px]">open_in_new</span>
        <span class="hidden sm:inline">Open File Directly</span>
      </a>
    </div>
  </header>

  <!-- Live Frame Container -->
  <main class="flex-1 bg-[#12120e] flex items-center justify-center p-2 relative overflow-hidden">
    <div id="frame-wrapper" class="w-full h-full bg-[#F5EDE0] rounded-xl shadow-2xl overflow-hidden device-frame border border-[#3e2723]">
      <iframe id="preview-iframe" src="home_vibes_caf/code.html" class="w-full h-full border-none"></iframe>
    </div>
  </main>

  <script>
    const screens = {
      home: 'home_vibes_caf/code.html',
      menu: 'menu_vibes_caf/code.html',
      about: 'about_vibes_caf/code.html',
      branches: 'branches_vibes_caf/code.html',
      gallery: 'gallery_vibes_caf/code.html',
      contact: 'contact_vibes_caf/code.html',
      reviews: 'reviews_vibes_caf/code.html',
      login: 'login_vibes_caf/code.html',
      worker: 'worker_dashboard_vibes_caf/code.html',
      admin: 'admin_dashboard_vibes_caf/code.html'
    };

    function loadScreen(key) {
      const url = screens[key] || screens.home;
      document.getElementById('preview-iframe').src = url;
      document.getElementById('direct-open-link').href = url;

      document.querySelectorAll('.screen-btn').forEach(btn => {
        if (btn.dataset.screen === key) {
          btn.className = 'screen-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-[#A84432] text-white font-bold transition-all shadow-md';
        } else {
          btn.className = 'screen-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-[#ae8d87] hover:text-white transition-all';
        }
      });
    }

    function setViewport(size) {
      const wrapper = document.getElementById('frame-wrapper');
      const deskBtn = document.getElementById('vp-desktop');
      const tabBtn = document.getElementById('vp-tablet');
      const mobBtn = document.getElementById('vp-mobile');

      deskBtn.className = 'p-1.5 rounded-lg text-[#ae8d87] hover:text-white';
      tabBtn.className = 'p-1.5 rounded-lg text-[#ae8d87] hover:text-white';
      mobBtn.className = 'p-1.5 rounded-lg text-[#ae8d87] hover:text-white';

      if (size === 'mobile') {
        wrapper.style.width = '375px';
        wrapper.style.height = '667px';
        mobBtn.className = 'p-1.5 rounded-lg bg-[#3e2723] text-white';
      } else if (size === 'tablet') {
        wrapper.style.width = '768px';
        wrapper.style.height = '100%';
        tabBtn.className = 'p-1.5 rounded-lg bg-[#3e2723] text-white';
      } else {
        wrapper.style.width = '100%';
        wrapper.style.height = '100%';
        deskBtn.className = 'p-1.5 rounded-lg bg-[#3e2723] text-white';
      }
    }
  </script>
</body>
</html>
